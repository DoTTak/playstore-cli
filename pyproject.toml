[project]
name = "playstore-cli"
version = "0.1.0"
description = "Unofficial Google Play Store client (for research and learning)"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=5.28.3,<6",
    "requests>=2.32",
    "websocket-client>=1.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
